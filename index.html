<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelated Snake Game - Enhanced</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Neon Theme (Default) */
      --bg-color: #0d0d12;
      --container-bg: #111116;
      --canvas-bg: #050508;
      --grid-line: #0e0e16;
      --primary: #00ff66;
      --primary-dark: #00bb44;
      --secondary: #ff0055;
      --secondary-light: #ff88aa;
      --text-color: #ffffff;
      --text-dim: #666680;
    }

    body.theme-gameboy {
      --bg-color: #8b956d;
      --container-bg: #c4cfa1;
      --canvas-bg: #e0f0cb;
      --grid-line: #c4cfa1;
      --primary: #4d533c;
      --primary-dark: #3b402e;
      --secondary: #4d533c;
      --secondary-light: #3b402e;
      --text-color: #4d533c;
      --text-dim: #4d533c;
    }

    body.theme-synthwave {
      --bg-color: #1a0b2e;
      --container-bg: #2b1055;
      --canvas-bg: #140524;
      --grid-line: #21083a;
      --primary: #00f3ff;
      --primary-dark: #00a8ff;
      --secondary: #ff00c8;
      --secondary-light: #ff7eea;
      --text-color: #ffffff;
      --text-dim: #8b6bba;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--primary);
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s;
    }

    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--container-bg);
      padding: 24px;
      border: 4px solid var(--primary);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      width: 95vw;
      max-width: 460px;
    }

    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--primary);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--primary-dark);
      background-color: var(--canvas-bg);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 15px;
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    .title {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
      line-height: 1.4;
    }

    .game-over-title {
      font-size: 22px;
      color: var(--secondary);
      margin-bottom: 20px;
    }

    .settings-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 250px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: var(--text-color);
    }

    select, input[type="checkbox"] {
      background: var(--canvas-bg);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 4px;
      outline: none;
      cursor: pointer;
    }

    .restart-hint {
      font-size: 10px;
      color: var(--primary);
      line-height: 1.6;
      animation: blink 1s infinite;
      cursor: pointer;
    }

    .controls-hint {
      margin-top: 18px;
      font-size: 9px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.5;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }
  </style>
</head>
<body>

  <div class="game-container" id="gameContainer">
    <div class="header">
      <div>SCORE: <span id="score">0000</span></div>
      <div>HIGH: <span id="highScore">0000</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- Start Overlay with Settings -->
      <div id="startOverlay" class="overlay">
        <div class="title">PIXEL<br>SNAKE</div>
        
        <div class="settings-panel">
          <div class="setting-row">
            <label for="themeSelect">THEME:</label>
            <select id="themeSelect">
              <option value="neon">NEON</option>
              <option value="gameboy">GAMEBOY</option>
              <option value="synthwave">SYNTH</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="diffSelect">SPEED:</label>
            <select id="diffSelect">
              <option value="160">EASY</option>
              <option value="120" selected>NORMAL</option>
              <option value="80">HARD</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="wrapToggle">EDGE WRAP:</label>
            <input type="checkbox" id="wrapToggle">
          </div>
        </div>

        <div class="restart-hint" id="startBtn">TAP / SPACE TO PLAY</div>
      </div>

      <!-- Pause Overlay -->
      <div id="pauseOverlay" class="overlay hidden">
        <div class="title" style="color: var(--text-color);">PAUSED</div>
        <div class="restart-hint" style="animation: none;">PRESS P TO RESUME</div>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameOverOverlay" class="overlay hidden">
        <div class="game-over-title">GAME OVER</div>
        <div style="font-size: 12px; color: var(--text-color); margin-bottom: 30px; line-height: 1.8;">
          FINAL SCORE<br>
          <span id="finalScore" style="color: var(--primary); font-size: 18px;">0</span>
        </div>
        <div class="restart-hint" id="restartBtn">TAP / SPACE TO RESTART</div>
      </div>
    </div>

    <div class="controls-hint">
      DESKTOP: ARROWS / WASD / P (PAUSE)<br>
      MOBILE: SWIPE TO MOVE
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('gameContainer');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('highScore');
    const finalScoreElement = document.getElementById('finalScore');
    
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const themeSelect = document.getElementById('themeSelect');
    const diffSelect = document.getElementById('diffSelect');
    const wrapToggle = document.getElementById('wrapToggle');

    // Grid configuration
    const GRID_SIZE = 20; 
    const TILE_COUNT = canvas.width / GRID_SIZE; 

    // Game variables
    let snake = [];
    let direction = { x: 0, y: 0 };
    let nextDirection = { x: 0, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let highScore = localStorage.getItem('snake_high_score') || 0;
    let gameLoopId = null;
    let lastRenderTime = 0;
    let baseSpeed = 120; 
    let currentSpeed = baseSpeed;
    let gameState = 'START'; // 'START', 'RUNNING', 'PAUSED', 'GAMEOVER'
    let isEdgeWrap = false;
    let blinkEye = false;

    // Audio Context (Initialized on first interaction)
    let audioCtx;

    // Load saved settings
    highScoreElement.textContent = String(highScore).padStart(4, '0');
    if (localStorage.getItem('snake_theme')) {
      themeSelect.value = localStorage.getItem('snake_theme');
      applyTheme(themeSelect.value);
    }
    if (localStorage.getItem('snake_wrap') === 'true') {
      wrapToggle.checked = true;
    }

    // Event Listeners
    window.addEventListener('keydown', handleKeyPress);
    themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));
    document.getElementById('startBtn').addEventListener('click', initGame);
    document.getElementById('restartBtn').addEventListener('click', initGame);

    // Touch / Swipe Mechanics
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    window.addEventListener('touchend', e => {
      if (gameState !== 'RUNNING') return;
      let dx = e.changedTouches[0].screenX - touchStartX;
      let dy = e.changedTouches[0].screenY - touchStartY;
      
      // Require a minimum swipe distance
      if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
          // Horizontal swipe
          if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
          else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
        } else {
          // Vertical swipe
          if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
          else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
        }
      }
    }, {passive: true});

    function applyTheme(themeName) {
      document.body.className = '';
      if (themeName !== 'neon') {
        document.body.classList.add(`theme-${themeName}`);
      }
      localStorage.setItem('snake_theme', themeName);
      if (gameState === 'START' || gameState === 'GAMEOVER') draw(); // Redraw static screen
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      
      if (type === 'eat') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    function handleKeyPress(e) {
      const key = e.key.toLowerCase();

      if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'START' || gameState === 'GAMEOVER') {
          initGame();
        }
        return;
      }

      if (key === 'p' || key === 'escape') {
        togglePause();
        return;
      }

      if (gameState !== 'RUNNING') return;

      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
        e.preventDefault();
      }

      if ((key === 'arrowup' || key === 'w') && direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      } else if ((key === 'arrowdown' || key === 's') && direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      } else if ((key === 'arrowleft' || key === 'a') && direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      } else if ((key === 'arrowright' || key === 'd') && direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }
    }

    function togglePause() {
      if (gameState === 'RUNNING') {
        gameState = 'PAUSED';
        pauseOverlay.classList.remove('hidden');
      } else if (gameState === 'PAUSED') {
        gameState = 'RUNNING';
        pauseOverlay.classList.add('hidden');
        lastRenderTime = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    function initGame() {
      initAudio();
      
      // Apply Settings
      baseSpeed = parseInt(diffSelect.value);
      isEdgeWrap = wrapToggle.checked;
      localStorage.setItem('snake_wrap', isEdgeWrap);

      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      currentSpeed = baseSpeed;
      updateScoreDisplay();
      gameContainer.classList.remove('shake');

      spawnFood();

      gameState = 'RUNNING';
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');

      lastRenderTime = performance.now();
      if (gameLoopId) cancelAnimationFrame(gameLoopId);
      gameLoopId = requestAnimationFrame(gameLoop);
    }

    function spawnFood() {
      let validPosition = false;
      while (!validPosition) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function gameLoop(currentTime) {
      if (gameState !== 'RUNNING') return;

      gameLoopId = requestAnimationFrame(gameLoop);

      const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
      if (secondsSinceLastRender < currentSpeed / 1000) return;

      lastRenderTime = currentTime;

      // Random chance to blink eyes
      blinkEye = Math.random() < 0.08;

      update();
      draw();
    }

    function update() {
      direction = { ...nextDirection };

      let head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Collision Detection: Walls / Wrapping
      if (isEdgeWrap) {
        if (head.x < 0) head.x = TILE_COUNT - 1;
        else if (head.x >= TILE_COUNT) head.x = 0;
        
        if (head.y < 0) head.y = TILE_COUNT - 1;
        else if (head.y >= TILE_COUNT) head.y = 0;
      } else {
        if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
          handleGameOver();
          return;
        }
      }

      // Collision Detection: Self
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        handleGameOver();
        return;
      }

      snake.unshift(head);

      // Check Food Collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        playSound('eat');
        updateScoreDisplay();
        spawnFood();

        // Speed increases dynamically based on base speed settings
        currentSpeed = Math.max(45, baseSpeed - Math.floor(score / 30) * 5);
      } else {
        snake.pop();
      }
    }

    function getCSSVar(name) {
      return getComputedStyle(document.body).getPropertyValue(name).trim();
    }

    function draw() {
      const cBg = getCSSVar('--canvas-bg');
      const cGrid = getCSSVar('--grid-line');
      const cPri = getCSSVar('--primary');
      const cPriDark = getCSSVar('--primary-dark');
      const cSec = getCSSVar('--secondary');
      const cSecLight = getCSSVar('--secondary-light');

      // Clear canvas
      ctx.fillStyle = cBg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw faint pixel grid lines
      ctx.strokeStyle = cGrid;
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Draw Food
      const foodPx = food.x * GRID_SIZE;
      const foodPy = food.y * GRID_SIZE;
      
      ctx.fillStyle = cSec;
      ctx.fillRect(foodPx + 1, foodPy + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      // Food Highlight
      ctx.fillStyle = cSecLight;
      ctx.fillRect(foodPx + 3, foodPy + 3, 4, 4);

      // Draw Snake
      snake.forEach((segment, index) => {
        const px = segment.x * GRID_SIZE;
        const py = segment.y * GRID_SIZE;

        if (index === 0) {
          // Head
          ctx.fillStyle = cPri;
          ctx.fillRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2);

          // Eyes
          if (!blinkEye) {
            ctx.fillStyle = cBg; // Eye color matches canvas background
            if (direction.x === 1) {
              ctx.fillRect(px + 13, py + 3, 3, 3); ctx.fillRect(px + 13, py + 13, 3, 3);
            } else if (direction.x === -1) {
              ctx.fillRect(px + 4, py + 3, 3, 3); ctx.fillRect(px + 4, py + 13, 3, 3);
            } else if (direction.y === -1) {
              ctx.fillRect(px + 3, py + 4, 3, 3); ctx.fillRect(px + 13, py + 4, 3, 3);
            } else {
              ctx.fillRect(px + 3, py + 13, 3, 3); ctx.fillRect(px + 13, py + 13, 3, 3);
            }
          }
        } else {
          // Body
          ctx.fillStyle = index % 2 === 0 ? cPriDark : cPri;
          ctx.fillRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2);
          
          // Texture
          ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
          ctx.fillRect(px + 3, py + 3, 4, 4);
        }
      });
    }

    function updateScoreDisplay() {
      scoreElement.textContent = String(score).padStart(4, '0');
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_high_score', highScore);
        highScoreElement.textContent = String(highScore).padStart(4, '0');
      }
    }

    function handleGameOver() {
      gameState = 'GAMEOVER';
      playSound('crash');
      
      // Trigger CSS Screen Shake
      gameContainer.classList.add('shake');
      
      finalScoreElement.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    // Initial draw for background styling
    draw();
  </script>
</body>
</html>
